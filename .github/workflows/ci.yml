name: CI - G1 synthetic build

# G1 / Step 7 gate: green synthetic build + SBOM artifact.
# All values below are deliberately synthetic and PHI-free. No real credentials
# or secrets are stored in this repository or in this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Synthetic, non-secret placeholders used only to import the app in tests.
  # They point at loopback / .invalid hosts; no real data or credentials.
  SUPABASE_URL: https://synthetic-project.supabase.co
  SUPABASE_ANON_KEY: synthetic-anon-key-not-a-secret
  SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key-not-a-secret
  DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/synthetic
  FRONTEND_URL: http://localhost:5173

jobs:
  backend:
    name: Backend pytest + SBOM (synthetic)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Select interpreter
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/backend"
          # Use the checked-in workspace venv when a developer has one; in CI
          # it is gitignored, so fall back to the setup-python interpreter.
          if [ -x "$PWD/venv/bin/python" ]; then
            PY="$PWD/venv/bin/python"
          elif [ -x "$PWD/venv/Scripts/python.exe" ]; then
            PY="$PWD/venv/Scripts/python.exe"
          else
            PY="$(command -v python3 || command -v python)"
          fi
          echo "Selected Python interpreter: $PY"
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run backend pytest
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/backend"
          "$PY" -m pytest -q

      - name: Generate CycloneDX SBOM
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/generate-sbom.sh"

      - name: Upload G1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: g1-sbom
          path: artifacts/
          if-no-files-found: error

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build:checked

      - name: Upload frontend build output
        uses: actions/upload-artifact@v4
        with:
          name: g1-frontend-dist
          path: frontend/dist/
          if-no-files-found: warn
